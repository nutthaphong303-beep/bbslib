<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>อ่านงานวิจัย</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:#3a2630;color:#fff;font-family:'Sarabun',system-ui,sans-serif;-webkit-user-select:none;user-select:none}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;background:#9d7d8b;color:#2b1d24}
.bar a,.bar button{color:#2b1d24;background:#e6d3db;border:0;border-radius:999px;padding:6px 14px;font:inherit;text-decoration:none;cursor:pointer}
.bar button:hover,.bar a:hover{background:#f3e6eb}
.bar h1{font-size:1rem;margin:0;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zoom{display:flex;align-items:center;gap:6px}
.zoom button{padding:6px 12px}
#zp{min-width:3.2em;text-align:center}
#stage{flex:1;position:relative;overflow:hidden}
#flip{height:100%;display:flex;align-items:center;justify-content:center;padding:12px}
#single{height:100%;overflow:auto;padding:12px 0}
#cv{display:block;margin:0 auto;background:#fff;box-shadow:0 4px 18px #0007}
.page{background:#fff}
.page img{width:100%;height:100%;display:block;-webkit-user-drag:none;user-drag:none}
[hidden]{display:none!important}
#msg{text-align:center;padding:40px}
@media print{body{display:none}}
</style>
</head>
<body>
<div class="bar">
  <a href="/">← ชั้นหนังสือ</a>
  <h1 id="t">กำลังโหลด…</h1>
  <button id="mode" type="button">หน้าเดียว</button>
  <button id="prev" type="button" aria-label="หน้าก่อนหน้า">ก่อนหน้า</button>
  <span id="pn"></span>
  <button id="next" type="button" aria-label="หน้าถัดไป">ถัดไป</button>
  <span class="zoom">
    <button id="zo" type="button" aria-label="ซูมออก">−</button>
    <span id="zp">100%</span>
    <button id="zi" type="button" aria-label="ซูมเข้า">+</button>
  </span>
</div>
<div id="stage">
  <div id="flip" hidden><div id="book"></div></div>
  <div id="single" hidden><canvas id="cv"></canvas></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
const $=s=>document.querySelector(s);
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdf,n=0,vp,mode='flip',cur=0,z=1,pf=null,token=0;
const imgs=[],done=new Set();

// ลายน้ำ BURAPHA ฝังลงในภาพของหน้านั้นเลย (ไม่ใช่แค่ชั้นซ้อนทับ)
function wm(ctx,w,h){
  ctx.save();
  ctx.globalAlpha=.13;ctx.fillStyle='#4e3441';
  const fs=Math.round(w/11);
  ctx.font=`700 ${fs}px Arial,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.translate(w/2,h/2);ctx.rotate(-Math.PI/6);
  const stepY=fs*3.2,stepX=ctx.measureText('BURAPHA').width*1.6,R=Math.hypot(w,h)/2;
  for(let y=-R;y<=R;y+=stepY){
    const off=Math.round(y/stepY)%2?stepX/2:0;
    for(let x=-R;x<=R;x+=stepX)ctx.fillText('BURAPHA',x+off,y);
  }
  ctx.restore();
}

async function pageCanvas(i,scale){
  const pg=await pdf.getPage(i+1),v=pg.getViewport({scale});
  const c=document.createElement('canvas');
  c.width=Math.floor(v.width);c.height=Math.floor(v.height);
  const ctx=c.getContext('2d');
  await pg.render({canvasContext:ctx,viewport:v}).promise;
  wm(ctx,c.width,c.height);
  return c;
}

const upd=()=>{$('#pn').textContent=`${cur+1} / ${n}`};

// ---------- โหมดพลิกหน้า ----------
async function renderFlip(i){
  if(i<0||i>=n||done.has(i))return;done.add(i);
  imgs[i].src=(await pageCanvas(i,1.6)).toDataURL('image/jpeg',.85);
}
const preload=p=>{for(let k=p-2;k<=p+3;k++)renderFlip(k)};

function initFlip(){
  if(pf)return;
  const pages=[];
  for(let i=0;i<n;i++){
    const d=document.createElement('div');d.className='page';
    const im=document.createElement('img');im.draggable=false;d.appendChild(im);
    imgs.push(im);pages.push(d);$('#book').appendChild(d);
  }
  const h=Math.min(innerHeight-90,1100),w=h*vp.width/vp.height;
  pf=new St.PageFlip($('#book'),{width:w,height:h,size:'stretch',minWidth:280,maxWidth:800,minHeight:380,maxHeight:1100,showCover:true,maxShadowOpacity:.5,mobileScrollSupport:false});
  pf.loadFromHTML(pages);
  pf.on('flip',e=>{cur=e.data;upd();preload(cur)});
}

// ---------- โหมดหน้าเดียว + ซูม ----------
async function drawSingle(resetScroll){
  const t=++token,box=$('#single');
  const base=Math.min((box.clientWidth-24)/vp.width,2.5);
  const css=base*z;
  let px=css*Math.min(devicePixelRatio||1,2);
  if(vp.width*px>4000)px=4000/vp.width;           // กันภาพใหญ่เกินที่เบราว์เซอร์รับไหว
  const c=await pageCanvas(cur,px);
  if(t!==token)return;                              // มีคำสั่งใหม่แทรก ทิ้งผลเก่า
  const cv=$('#cv');
  cv.width=c.width;cv.height=c.height;
  cv.style.width=vp.width*css+'px';cv.style.height=vp.height*css+'px';
  cv.getContext('2d').drawImage(c,0,0);
  $('#zp').textContent=Math.round(z*100)+'%';
  if(resetScroll)box.scrollTop=0;
}

async function setMode(m){
  mode=m;
  $('#flip').hidden=m!=='flip';$('#single').hidden=m!=='single';
  $('#mode').textContent=m==='flip'?'หน้าเดียว':'พลิกหน้า';
  if(m==='flip'){initFlip();pf.turnToPage(cur);preload(cur)}
  else drawSingle(true);
  upd();
}

function go(i){
  if(i<0||i>=n)return;
  if(mode==='flip'){pf.flip(i)}else{cur=i;upd();drawSingle(true)}
}
function step(d){
  if(mode==='flip'){d>0?pf.flipNext():pf.flipPrev()}else go(cur+d);
}
function zoom(d){
  if(mode==='flip')setMode('single');               // ซูมได้เฉพาะโหมดหน้าเดียว จึงสลับให้อัตโนมัติ
  z=Math.min(4,Math.max(.5,Math.round((z+d)*100)/100));
  drawSingle(false);
}

(async()=>{
  const id=new URLSearchParams(location.search).get('id');
  const r=await fetch('/api/papers/'+id);
  if(!r.ok){document.body.innerHTML='<p id="msg">ไม่พบงานวิจัยนี้ <a href="/" style="color:#fff">กลับไปที่ชั้นหนังสือ</a></p>';return}
  const paper=await r.json();
  document.title=paper.title;$('#t').textContent=paper.title;

  pdf=await pdfjsLib.getDocument('/api/file/'+paper.pdf_key).promise;
  n=pdf.numPages;
  vp=(await pdf.getPage(1)).getViewport({scale:1});

  $('#mode').onclick=()=>setMode(mode==='flip'?'single':'flip');
  $('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
  $('#zo').onclick=()=>zoom(-.25);$('#zi').onclick=()=>zoom(.25);
  addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft')step(-1);
    else if(e.key==='ArrowRight')step(1);
    else if(e.key==='+'||e.key==='=')zoom(.25);
    else if(e.key==='-')zoom(-.25);
  });
  $('#single').addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();zoom(e.deltaY<0?.25:-.25)}},{passive:false});
  let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(mode==='single')drawSingle(false)},250)});
  $('#stage').addEventListener('contextmenu',e=>e.preventDefault());

  setMode(innerWidth<820?'single':'flip');           // มือถือเริ่มที่หน้าเดียว
})();
</script>
</body>
</html>
