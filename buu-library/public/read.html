<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>อ่านงานวิจัย</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:#3a2630;color:#fff;font-family:'Sarabun',system-ui,sans-serif}
.bar{display:flex;gap:12px;align-items:center;padding:10px 16px;background:#9d7d8b;color:#2b1d24}
.bar a,.bar button{color:#2b1d24;background:#e6d3db;border:0;border-radius:999px;padding:6px 14px;font:inherit;text-decoration:none;cursor:pointer}
.bar h1{font-size:1rem;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:12px}
.page{background:#fff}
.page img{width:100%;height:100%;display:block}
#msg{text-align:center;padding:40px}
</style>
</head>
<body>
<div class="bar">
  <a href="/">← ชั้นหนังสือ</a><h1 id="t">กำลังโหลด…</h1>
  <button id="prev" aria-label="หน้าก่อนหน้า">ก่อนหน้า</button>
  <span id="pn"></span>
  <button id="next" aria-label="หน้าถัดไป">ถัดไป</button>
  <a id="dl" href="#" download>ดาวน์โหลด PDF</a>
</div>
<div id="stage"><div id="book"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
const $=s=>document.querySelector(s);
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
(async()=>{
  const id=new URLSearchParams(location.search).get('id');
  const r=await fetch('/api/papers/'+id);
  if(!r.ok){document.body.innerHTML='<p id="msg">ไม่พบงานวิจัยนี้ <a href="/" style="color:#fff">กลับไปที่ชั้นหนังสือ</a></p>';return}
  const paper=await r.json();
  document.title=paper.title;$('#t').textContent=paper.title;
  const url='/api/file/'+paper.pdf_key;
  $('#dl').href=url;$('#dl').download=paper.title+'.pdf';

  const pdf=await pdfjsLib.getDocument(url).promise;
  const n=pdf.numPages;
  const vp=(await pdf.getPage(1)).getViewport({scale:1});
  const imgs=[],pages=[];
  for(let i=0;i<n;i++){
    const d=document.createElement('div');d.className='page';
    const im=document.createElement('img');d.appendChild(im);imgs.push(im);pages.push(d);
    $('#book').appendChild(d);
  }
  const h=Math.min(innerHeight-90,1100),w=h*vp.width/vp.height;
  const pf=new St.PageFlip($('#book'),{width:w,height:h,size:'stretch',minWidth:280,maxWidth:800,minHeight:380,maxHeight:1100,showCover:true,maxShadowOpacity:.5,mobileScrollSupport:false});
  pf.loadFromHTML(pages);

  // วาดเฉพาะหน้าที่ใกล้หน้าปัจจุบัน เพื่อให้เปิดไฟล์ใหญ่ได้เร็ว
  const done=new Set();
  async function render(i){
    if(i<0||i>=n||done.has(i))return;done.add(i);
    const pg=await pdf.getPage(i+1),v=pg.getViewport({scale:1.6});
    const c=document.createElement('canvas');c.width=v.width;c.height=v.height;
    await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
    imgs[i].src=c.toDataURL('image/jpeg',.85);
  }
  const upd=p=>{$('#pn').textContent=`${p+1} / ${n}`;for(let k=p-2;k<=p+3;k++)render(k)};
  pf.on('flip',e=>upd(e.data));upd(0);
  $('#prev').onclick=()=>pf.flipPrev();$('#next').onclick=()=>pf.flipNext();
  addEventListener('keydown',e=>{if(e.key==='ArrowLeft')pf.flipPrev();if(e.key==='ArrowRight')pf.flipNext()});
})();
</script>
</body>
</html>
