<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>อ่านงานวิจัย</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
body{height:100vh;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
.topbar{gap:8px;padding:10px 16px}
.topbar h1{font-size:1rem;font-weight:600;margin:0;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pn{min-width:4.5em;text-align:center;color:var(--muted)}
.zoom{display:flex;align-items:center;gap:6px}
.zoom button{padding:6px 12px}
#zp{min-width:3.2em;text-align:center;color:var(--muted)}
#stage{flex:1;position:relative;overflow:hidden;background:#efe6da}
#flip{height:100%;display:flex;align-items:center;justify-content:center;padding:12px}
#single{height:100%;overflow:auto;padding:20px 0}
#single.anim{overflow:hidden!important}
#sheet{position:relative;margin:0 auto;perspective:2400px}
#cv{display:block;background:#fff;box-shadow:0 10px 30px #3a2a2033,0 1px 3px #3a2a2022}
.turn{position:absolute;left:0;top:0;transform-origin:left center;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;box-shadow:0 0 40px #3a2a2066;pointer-events:none}
.page{background:#fff}
.page img{width:100%;height:100%;display:block;-webkit-user-drag:none}
#msg{text-align:center;padding:40px}
@media print{body{display:none}}
</style>
</head>
<body>
<div class="topbar">
  <a class="btn" href="/">← ชั้นหนังสือ</a>
  <h1 id="t">กำลังโหลด…</h1>
  <button id="mode" type="button">หน้าเดียว</button>
  <button id="prev" type="button" aria-label="หน้าก่อนหน้า">ก่อนหน้า</button>
  <span id="pn"></span>
  <button id="next" type="button" aria-label="หน้าถัดไป">ถัดไป</button>
  <span class="zoom">
    <button id="zo" type="button" aria-label="ซูมออก">−</button>
    <span id="zp">100%</span>
    <button id="zi" type="button" aria-label="ซูมเข้า">+</button>
  </span>
</div>
<div id="stage">
  <div id="flip" hidden><div id="book"></div></div>
  <div id="single" hidden><div id="sheet"><canvas id="cv"></canvas></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
const $=s=>document.querySelector(s);
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdf,n=0,vp,mode='flip',cur=0,z=1,pf=null,token=0,busy=false;
const imgs=[],done=new Set();
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;

// ลายน้ำ BURAPHA ฝังลงในภาพของหน้านั้นเลย
function wm(ctx,w,h){
  ctx.save();
  ctx.globalAlpha=.12;ctx.fillStyle='#6b4a33';
  const fs=Math.round(w/11);
  ctx.font=`700 ${fs}px Arial,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.translate(w/2,h/2);ctx.rotate(-Math.PI/6);
  const stepY=fs*3.2,stepX=ctx.measureText('BURAPHA').width*1.6,R=Math.hypot(w,h)/2;
  for(let y=-R;y<=R;y+=stepY){
    const off=Math.round(y/stepY)%2?stepX/2:0;
    for(let x=-R;x<=R;x+=stepX)ctx.fillText('BURAPHA',x+off,y);
  }
  ctx.restore();
}

async function pageCanvas(i,scale){
  const pg=await pdf.getPage(i+1),v=pg.getViewport({scale});
  const c=document.createElement('canvas');
  c.width=Math.floor(v.width);c.height=Math.floor(v.height);
  const ctx=c.getContext('2d');
  await pg.render({canvasContext:ctx,viewport:v}).promise;
  wm(ctx,c.width,c.height);
  return c;
}

const upd=()=>{$('#pn').textContent=`${cur+1} / ${n}`};

// ---------- โหมดพลิกหน้า (เปิดหนังสือ 2 หน้า) ----------
async function renderFlip(i){
  if(i<0||i>=n||done.has(i))return;done.add(i);
  imgs[i].src=(await pageCanvas(i,1.6)).toDataURL('image/jpeg',.85);
}
const preload=p=>{for(let k=p-2;k<=p+3;k++)renderFlip(k)};

function initFlip(){
  if(pf)return;
  const pages=[];
  for(let i=0;i<n;i++){
    const d=document.createElement('div');d.className='page';
    const im=document.createElement('img');im.draggable=false;d.appendChild(im);
    imgs.push(im);pages.push(d);$('#book').appendChild(d);
  }
  const h=Math.min(innerHeight-90,1100),w=h*vp.width/vp.height;
  pf=new St.PageFlip($('#book'),{width:w,height:h,size:'stretch',minWidth:280,maxWidth:800,minHeight:380,maxHeight:1100,showCover:true,maxShadowOpacity:.5,mobileScrollSupport:false});
  pf.loadFromHTML(pages);
  pf.on('flip',e=>{cur=e.data;upd();preload(cur)});
}

// ---------- โหมดหน้าเดียว + ซูม + แอนิเมชันพลิกหน้า ----------
async function renderSingle(i){
  const box=$('#single');
  const base=Math.min((box.clientWidth-24)/vp.width,2.5),css=base*z;
  let px=css*Math.min(devicePixelRatio||1,2);
  if(vp.width*px>4000)px=4000/vp.width;
  return{c:await pageCanvas(i,px),w:vp.width*css,h:vp.height*css};
}
function paint(r){
  const cv=$('#cv');
  cv.width=r.c.width;cv.height=r.c.height;
  cv.style.width=r.w+'px';cv.style.height=r.h+'px';
  $('#sheet').style.width=r.w+'px';
  cv.getContext('2d').drawImage(r.c,0,0);
  $('#zp').textContent=Math.round(z*100)+'%';
}
async function drawSingle(reset){
  const t=++token,r=await renderSingle(cur);
  if(t!==token)return;
  paint(r);if(reset)$('#single').scrollTop=0;
}

// พลิกหน้า: ไปข้างหน้า = หน้าเดิมพลิกออกไปทางซ้าย / ย้อนกลับ = หน้าก่อนหน้าพลิกกลับมาทับ
async function turn(i){
  if(busy||i<0||i>=n||i===cur)return;
  busy=true;
  const fwd=i>cur,old=$('#cv'),box=$('#single');
  const r=await renderSingle(i);
  if(RM){cur=i;paint(r);upd();box.scrollTop=0;busy=false;return}
  const src=fwd?old:r.c,ov=document.createElement('canvas');
  ov.className='turn';ov.width=src.width;ov.height=src.height;
  ov.getContext('2d').drawImage(src,0,0);
  ov.style.width=fwd?old.style.width:r.w+'px';ov.style.height=fwd?old.style.height:r.h+'px';
  box.scrollTop=0;box.classList.add('anim');
  cur=i;upd();
  if(fwd)paint(r);                                  // หน้าใหม่รออยู่ข้างใต้
  $('#sheet').appendChild(ov);
  const f=[{transform:'rotateY(0deg)',filter:'brightness(1)'},{transform:'rotateY(-100deg)',filter:'brightness(.78)'}];
  if(!fwd)f.reverse();
  try{await ov.animate(f,{duration:650,easing:'cubic-bezier(.45,.05,.25,1)',fill:'forwards'}).finished}catch(_){}
  if(!fwd)paint(r);
  ov.remove();box.classList.remove('anim');busy=false;
}

async function setMode(m){
  mode=m;
  $('#flip').hidden=m!=='flip';$('#single').hidden=m!=='single';
  $('#mode').textContent=m==='flip'?'หน้าเดียว':'พลิกหน้า';
  if(m==='flip'){initFlip();pf.turnToPage(cur);preload(cur)}
  else drawSingle(true);
  upd();
}
function step(d){
  if(mode==='flip'){d>0?pf.flipNext():pf.flipPrev()}else turn(cur+d);
}
function zoom(d){
  if(busy)return;
  if(mode==='flip')setMode('single');
  z=Math.min(4,Math.max(.5,Math.round((z+d)*100)/100));
  drawSingle(false);
}

(async()=>{
  const id=new URLSearchParams(location.search).get('id');
  const r=await fetch('/api/papers/'+id);
  if(!r.ok){document.body.innerHTML='<p id="msg">ไม่พบงานวิจัยนี้ <a href="/">กลับไปที่ชั้นหนังสือ</a></p>';return}
  const paper=await r.json();
  document.title=paper.title;$('#t').textContent=paper.title;

  pdf=await pdfjsLib.getDocument('/api/file/'+paper.pdf_key).promise;
  n=pdf.numPages;
  vp=(await pdf.getPage(1)).getViewport({scale:1});

  $('#mode').onclick=()=>setMode(mode==='flip'?'single':'flip');
  $('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
  $('#zo').onclick=()=>zoom(-.25);$('#zi').onclick=()=>zoom(.25);
  addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft')step(-1);
    else if(e.key==='ArrowRight')step(1);
    else if(e.key==='+'||e.key==='=')zoom(.25);
    else if(e.key==='-')zoom(-.25);
  });
  $('#single').addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();zoom(e.deltaY<0?.25:-.25)}},{passive:false});
  let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(mode==='single'&&!busy)drawSingle(false)},250)});
  $('#stage').addEventListener('contextmenu',e=>e.preventDefault());

  setMode(innerWidth<820?'single':'flip');
})();
</script>
</body>
</html>
