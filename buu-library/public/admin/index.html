<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>หลังบ้าน – จัดการงานวิจัย</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
.wrap{max-width:860px;margin:0 auto;padding:28px 16px}
h1{font-size:1.4rem;font-weight:600;margin:0 0 16px}
.card{margin-bottom:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px}
small{color:var(--muted)}
button.del{color:#9b3a2b;border-color:#ecd2cc;padding:5px 14px}
button.edit{padding:5px 14px}
#prev{width:90px;height:127px;object-fit:cover;border-radius:3px;box-shadow:2px 3px 8px #3a2a2040;display:none}
.row{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row span{flex:1}
#st{margin-left:12px;color:var(--muted)}
.editing{border-color:var(--caramel)}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <form id="lg" class="card" hidden>
    <h1>เข้าสู่ระบบหลังบ้าน</h1>
    <label for="pw">รหัสผ่าน</label>
    <input id="pw" type="password" autocomplete="current-password" required style="margin-bottom:12px">
    <button class="primary">เข้าสู่ระบบ</button><span id="lgmsg" role="alert" style="margin-left:12px;color:#9b3a2b"></span>
  </form>
</div>
<div class="wrap" id="app" hidden>
  <h1><span id="ft">เพิ่มงานวิจัย</span> <button id="out" type="button" style="font-size:.8rem;padding:4px 12px;margin-left:8px">ออกจากระบบ</button></h1>
  <form id="f" class="card grid">
    <div class="full">
      <label for="pdf">ไฟล์ PDF</label>
      <input id="pdf" type="file" accept="application/pdf" required>
      <small id="ph" hidden>เว้นว่างไว้ถ้าไม่ต้องการเปลี่ยนไฟล์ PDF (ปกจะถูกสร้างใหม่เมื่อเลือกไฟล์ใหม่)</small>
    </div>
    <div class="full"><img id="prev" alt="ตัวอย่างปก"></div>
    <div class="full"><label for="title">ชื่อเรื่อง</label><input id="title" type="text" required></div>
    <div><label for="author">ผู้วิจัย</label><input id="author" type="text"></div>
    <div><label for="year">ปีที่พิมพ์</label><input id="year" type="number"></div>
    <div class="full"><label for="keywords">คำสำคัญ (คั่นด้วยเครื่องหมายจุลภาค)</label><input id="keywords" type="text"></div>
    <div class="full">
      <button id="go" class="primary">อัปโหลด</button>
      <button id="cancel" type="button" hidden>ยกเลิกการแก้ไข</button>
      <span id="st" role="status"></span>
    </div>
  </form>
  <div class="card"><h2 style="margin-top:0;font-size:1.1rem;font-weight:600">งานวิจัยทั้งหมด</h2><div id="list"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let coverBlob=null,editing=null,papers=[];

// สร้างปกจากหน้าแรกของ PDF ในเบราว์เซอร์
$('#pdf').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  if(!$('#title').value)$('#title').value=f.name.replace(/\.pdf$/i,'');
  $('#st').textContent='กำลังสร้างปก…';
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
  const pg=await pdf.getPage(1),v=pg.getViewport({scale:600/pg.getViewport({scale:1}).width});
  const c=document.createElement('canvas');c.width=v.width;c.height=v.height;
  await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
  coverBlob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
  $('#prev').src=URL.createObjectURL(coverBlob);$('#prev').style.display='block';$('#st').textContent='';
};

function resetForm(){
  editing=null;coverBlob=null;$('#f').reset();
  $('#pdf').required=true;$('#ph').hidden=true;$('#cancel').hidden=true;
  $('#prev').style.display='none';$('#f').classList.remove('editing');
  $('#ft').textContent='เพิ่มงานวิจัย';$('#go').textContent='อัปโหลด';
}
function startEdit(p){
  resetForm();editing=p;
  $('#title').value=p.title||'';$('#author').value=p.author||'';
  $('#year').value=p.year||'';$('#keywords').value=p.keywords||'';
  $('#pdf').required=false;$('#ph').hidden=false;$('#cancel').hidden=false;
  if(p.cover_key){$('#prev').src='/api/file/'+p.cover_key;$('#prev').style.display='block'}
  $('#f').classList.add('editing');
  $('#ft').textContent='แก้ไขงานวิจัย';$('#go').textContent='บันทึกการแก้ไข';
  $('#st').textContent='';scrollTo({top:0,behavior:'smooth'});
}
$('#cancel').onclick=resetForm;

$('#f').onsubmit=async e=>{
  e.preventDefault();
  const fd=new FormData(),file=$('#pdf').files[0];
  if(file)fd.append('pdf',file);
  if(coverBlob)fd.append('cover',coverBlob,'cover.jpg');
  for(const k of['title','author','year','keywords'])fd.append(k,$('#'+k).value);
  $('#go').disabled=true;$('#st').textContent=editing?'กำลังบันทึก…':'กำลังอัปโหลด…';
  const r=await fetch(editing?'/api/admin/papers/'+editing.id:'/api/admin/papers',{method:'POST',body:fd});
  $('#go').disabled=false;
  if(r.ok){const msg=editing?'บันทึกแล้ว':'อัปโหลดแล้ว';resetForm();$('#st').textContent=msg;list()}
  else $('#st').textContent='ผิดพลาด: '+((await r.json().catch(()=>({}))).error||r.status);
};

async function list(){
  const d=await (await fetch('/api/papers?sort=date')).json();
  papers=Array.isArray(d)?d:[];
  $('#list').innerHTML=papers.length?papers.map(p=>`<div class="row"><span>${esc(p.title)}<br><small>${esc([p.author,p.year].filter(Boolean).join(' · '))}</small></span><button class="edit" data-id="${p.id}">แก้ไข</button><button class="del" data-id="${p.id}">ลบ</button></div>`).join(''):'ยังไม่มีงานวิจัย เลือกไฟล์ PDF ด้านบนเพื่อเริ่มเพิ่ม';
}
$('#list').onclick=async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.classList.contains('edit'))return startEdit(papers.find(x=>x.id===b.dataset.id));
  if(b.classList.contains('del')&&confirm('ลบงานวิจัยนี้ถาวรหรือไม่')){
    await fetch('/api/admin/papers/'+b.dataset.id,{method:'DELETE'});
    if(editing&&editing.id===b.dataset.id)resetForm();list();
  }
};

// ล็อกอิน
async function boot(){
  const ok=(await fetch('/api/admin/me')).ok;
  $('#lg').hidden=ok;$('#app').hidden=!ok;$('#lg').parentElement.hidden=ok?true:false;
  if(ok)list();else $('#pw').focus();
}
$('#lg').onsubmit=async e=>{
  e.preventDefault();$('#lgmsg').textContent='';
  const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#pw').value})});
  if(r.ok){$('#pw').value='';boot()}else $('#lgmsg').textContent=(await r.json()).error||'เข้าสู่ระบบไม่สำเร็จ';
};
$('#out').onclick=async()=>{await fetch('/api/logout',{method:'POST'});boot()};
boot();
</script>
</body>
</html>
